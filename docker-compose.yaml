services:
  db:
    image: postgres:16
    container_name: mafia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mafia}
      POSTGRES_DB: ${DB_NAME:-event-manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prod} -d ${DB_NAME:-event-manager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: mafia-bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data:
