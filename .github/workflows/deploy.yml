
name: Build and deploy Mafia Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mafia-bot-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/n3sostr3l/mafia-itmo-manager-bot:latest
            ghcr.io/n3sostr3l/mafia-itmo-manager-bot:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [[ "$VPS_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+$ ]]; then
            echo "Fingerprint format looks valid"
          else
            echo "::error::Fingerprint is empty or has an unexpected format"
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST is empty or unavailable to this workflow"
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "::error::VPS_USER is empty or unavailable to this workflow"
            exit 1
          fi
          echo "VPS_HOST is configured"
          echo "VPS_USER is configured"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN
          port: 41830
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin
            cd /opt/mafia
            docker compose pull bot
            docker compose up -d --no-deps bot
            sleep 5
            docker inspect mafia-bot \
              --format '{{.State.Status}}'
            docker logs --tail 60 mafia-bot
