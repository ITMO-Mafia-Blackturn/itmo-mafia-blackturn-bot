
name: Build and deploy Mafia Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mafia-bot-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/n3sostr3l/mafia-itmo-manager-bot:latest
            ghcr.io/n3sostr3l/mafia-itmo-manager-bot:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # - name: Configure SSH
      #   env:
      #     VPS_HOST: ${{ secrets.VPS_HOST }}
      #     VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      #     VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
      #   run: |
      #     set -euo pipefail
      #     mkdir -p ~/.ssh
      #     chmod 700 ~/.ssh

      #     printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
      #     chmod 600 ~/.ssh/id_ed25519

      #     ssh-keyscan -p 41830 -t ed25519 "$VPS_HOST" \
      #       2>/dev/null > ~/.ssh/known_hosts

      #     ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')

      #     if [ "$ACTUAL" != "$VPS_HOST_FINGERPRINT" ]; then
      #       echo "::error::SSH host fingerprint mismatch"
      #       exit 1
      #     fi

      #     echo "SSH host fingerprint verified"

      - name: Login to GHCR on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p 41830 \
            "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy bot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p 41830 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             cd /opt/mafia
             docker compose pull bot
             docker compose up -d --no-deps bot
             sleep 5
             docker inspect mafia-bot --format "{{.State.Status}}"
             docker logs --tail 60 mafia-bot'
